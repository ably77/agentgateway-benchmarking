---
# fast-mcp AgentgatewayBackend — label-selector backend for session pinning
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: fast-mcp-backend
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: fast-mcp
        selector:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform
          services:
            matchLabels:
              app: fast-mcp
